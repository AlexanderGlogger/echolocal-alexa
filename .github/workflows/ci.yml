name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  GOWORK: "off"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: make vet

      - name: test
        run: make test

      # The race detector needs cgo.
      - name: test -race
        run: make test-race
        env:
          CGO_ENABLED: 1

      - name: cross-compile biscuit without native tools
        run: |
          make build-echod DOT_ARCH=arm NDK=/nonexistent
          make build-echod DOT_ARCH=arm64 NDK=/nonexistent

      - name: ensure biscuit excludes display dependencies
        env:
          GOOS: linux
          GOARCH: arm
          CGO_ENABLED: 0
        run: |
          go list -deps ./cmd/echod > "$RUNNER_TEMP/biscuit-deps"
          if grep -Eq 'libcountertop/pkg/display/|echolocal/internal/(feature/(gui|livecam)|hardware/display)$' "$RUNNER_TEMP/biscuit-deps"; then
            cat "$RUNNER_TEMP/biscuit-deps"
            exit 1
          fi

      - name: build without the assembly
        run: make build-echod TAGS=noasm

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

  show:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [checkers, cronos]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: build Show with its native payload
        run: make build-echod BOARD=${{ matrix.board }}
      - name: native wire checks
        run: make test-surface
