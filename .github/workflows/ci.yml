name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  GOWORK: "off"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: make vet

      - name: test
        run: make test

      # The race detector needs cgo.
      - name: test -race
        run: make test-race
        env:
          CGO_ENABLED: 1

      - name: cross-compile biscuit without native tools
        run: |
          make build-echod DOT_ARCH=arm NDK=/nonexistent
          make build-echod DOT_ARCH=arm64 NDK=/nonexistent

      - name: build without the assembly
        run: make build-echod TAGS=noasm

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: format check
        run: golangci-lint fmt --diff

      - name: lint
        run: golangci-lint run

      - name: lint biscuit
        run: golangci-lint run --build-tags board_biscuit

  show:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [checkers, cronos, crown]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: build Show with its native payload
        run: make build-echod BOARD=${{ matrix.board }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - name: lint with the board tag
        run: golangci-lint run --build-tags board_${{ matrix.board }},payload
      - name: native wire checks
        if: matrix.board == 'checkers'
        run: make test-surface
